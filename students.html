<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1학년 2반 학생 명단 관리 👥</title>
<link href="https://fonts.googleapis.com/css2?family=Gmarket+Sans:wght@300;500;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --primary:#0369A1; --glow:#38BDF8; --accent:#F59E0B;
  --green:#10B981; --red:#EF4444;
  --bg:#0B1220; --surface:#141D2E; --surface2:#1C283C;
  --border:rgba(255,255,255,0.08);
  --text:#EAF4FF; --muted:#7F93AD;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* ── Loading ── */
.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:20px;color:var(--muted);}
.spinner{width:48px;height:48px;border:3px solid rgba(56,189,248,0.2);border-top-color:var(--glow);border-radius:50%;animation:spin 0.9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── Login ── */
.login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:radial-gradient(ellipse at 30% 20%,rgba(56,189,248,0.13) 0%,transparent 60%),radial-gradient(ellipse at 70% 80%,rgba(245,158,11,0.08) 0%,transparent 60%),var(--bg);padding:24px;}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:28px;padding:56px 48px;text-align:center;max-width:400px;width:100%;position:relative;overflow:hidden;}
.login-card::before{content:'';position:absolute;top:-60px;left:50%;transform:translateX(-50%);width:200px;height:200px;background:radial-gradient(circle,rgba(56,189,248,0.22) 0%,transparent 70%);pointer-events:none;}
.login-icon{font-size:64px;margin-bottom:20px;}
.login-title{font-family:'Gmarket Sans',sans-serif;font-size:32px;font-weight:700;background:linear-gradient(135deg,#BAE6FD,#38BDF8,#F59E0B);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;}
.login-sub{font-size:14px;color:var(--muted);margin-bottom:40px;line-height:1.7;}
.btn-google{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:14px;color:var(--text);font-size:15px;font-weight:700;cursor:pointer;transition:all 0.25s;font-family:'Noto Sans KR',sans-serif;}
.btn-google:hover{background:rgba(56,189,248,0.12);border-color:rgba(56,189,248,0.4);transform:translateY(-2px);}
.btn-primary{background:linear-gradient(135deg,var(--primary),#075985);color:white;border:none;border-radius:12px;padding:14px 28px;font-size:15px;font-weight:700;cursor:pointer;width:100%;font-family:'Noto Sans KR',sans-serif;}
.link-row{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap;}
.link-row a{color:var(--muted);font-size:12px;text-decoration:none;border:1px solid var(--border);border-radius:9px;padding:7px 13px;transition:all 0.2s;}
.link-row a:hover{color:var(--glow);border-color:rgba(56,189,248,0.45);}

/* ── Header ── */
.header{background:rgba(20,29,46,0.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;gap:12px;flex-wrap:wrap;}
.header-left{display:flex;align-items:center;gap:14px;}
.header-title{font-family:'Gmarket Sans',sans-serif;font-size:18px;font-weight:700;}
.header-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.user-avatar{width:34px;height:34px;border-radius:50%;border:2px solid rgba(56,189,248,0.5);}
.user-name{font-size:13px;color:var(--muted);}
.badge-teacher{background:linear-gradient(135deg,#F59E0B,#EF4444);color:white;border-radius:8px;padding:3px 10px;font-size:11px;font-weight:900;letter-spacing:0.5px;}
.nav-links{display:flex;gap:6px;flex-wrap:wrap;}
.nav-links a{color:var(--muted);font-size:12px;font-weight:700;text-decoration:none;border:1px solid var(--border);border-radius:9px;padding:6px 11px;transition:all 0.2s;white-space:nowrap;}
.nav-links a:hover{color:var(--glow);border-color:var(--glow);}
.nav-links a.cur{color:var(--glow);border-color:var(--glow);background:rgba(255,255,255,0.05);}
.btn-signout{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:6px 14px;cursor:pointer;font-size:12px;transition:all 0.2s;font-family:'Noto Sans KR',sans-serif;}
.btn-signout:hover{border-color:var(--red);color:var(--red);}

/* ── Main ── */
.main-wrap{max-width:1000px;margin:0 auto;padding:32px 24px 80px;}
.section-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:16px;margin-top:36px;}

/* ── Panel ── */
.admin-panel{background:rgba(56,189,248,0.06);border:1px dashed rgba(56,189,248,0.35);border-radius:18px;padding:20px 22px;}
.admin-title{font-size:12px;font-weight:900;color:var(--glow);margin-bottom:14px;letter-spacing:1px;text-transform:uppercase;}
.admin-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:11px;font-weight:700;color:var(--muted);}
.admin-input{background:rgba(255,255,255,0.06);border:1px solid rgba(56,189,248,0.28);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--text);font-family:'Noto Sans KR',sans-serif;transition:border-color 0.2s;color-scheme:dark;}
.admin-input:focus{outline:none;border-color:var(--glow);}
textarea.admin-input{width:100%;min-height:130px;resize:vertical;line-height:1.7;font-size:13px;}
.btn-admin{background:linear-gradient(135deg,var(--primary),#075985);color:white;border:none;border-radius:10px;padding:11px 20px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:'Noto Sans KR',sans-serif;}
.btn-admin.ghost{background:transparent;border:1px solid rgba(56,189,248,0.45);color:var(--glow);}
.btn-admin.danger{background:transparent;border:1px solid rgba(239,68,68,0.5);color:#FCA5A5;}
.btn-admin:disabled{opacity:0.4;cursor:not-allowed;}
.admin-hint{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.7;}
.admin-hint code{background:rgba(255,255,255,0.08);border-radius:5px;padding:1px 6px;font-size:11.5px;}

/* ── 통계 ── */
.stat-row{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:16px;}
.stat{display:flex;flex-direction:column;gap:2px;}
.stat b{font-family:'Gmarket Sans',sans-serif;font-size:26px;color:var(--glow);}
.stat span{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:1px;}

/* ── 표 ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:8px 18px 14px;}
.tbl-scroll{overflow-x:auto;}
.tbl{width:100%;border-collapse:collapse;min-width:620px;}
.tbl th{font-size:11px;font-weight:900;color:var(--muted);text-align:left;padding:12px 8px;border-bottom:1px solid var(--border);letter-spacing:1px;white-space:nowrap;}
.tbl td{padding:12px 8px;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:hover td{background:rgba(255,255,255,0.02);}
.num-badge{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:28px;border-radius:8px;background:rgba(56,189,248,0.14);border:1px solid rgba(56,189,248,0.3);color:var(--glow);font-family:'Gmarket Sans',sans-serif;font-size:13px;font-weight:700;}
.nm-cell{font-weight:900;}
.em-cell{font-size:12.5px;color:var(--muted);word-break:break-all;}
.tag{display:inline-block;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700;white-space:nowrap;}
.tag.on{background:rgba(16,185,129,0.14);border:1px solid rgba(16,185,129,0.4);color:#6EE7B7;}
.tag.off{background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--muted);}
.row-acts{display:flex;gap:6px;justify-content:flex-end;}
.mini{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:6px 11px;font-size:12px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all 0.2s;white-space:nowrap;}
.mini:hover{border-color:var(--glow);color:var(--glow);}
.mini.danger:hover{border-color:var(--red);color:#FCA5A5;}
.empty-state{text-align:center;padding:46px 20px;color:var(--muted);line-height:1.8;}
.empty-state .em{font-size:44px;margin-bottom:12px;}

/* ── 붙여넣기 미리보기 ── */
.pv-list{margin-top:14px;display:flex;flex-direction:column;gap:6px;max-height:280px;overflow-y:auto;}
.pv-item{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:13px;}
.pv-item.bad{background:rgba(239,68,68,0.08);border-color:rgba(239,68,68,0.35);}
.pv-item .pv-n{font-family:'Gmarket Sans',sans-serif;font-weight:700;color:var(--glow);min-width:30px;}
.pv-item .pv-nm{font-weight:900;min-width:70px;}
.pv-item .pv-em{color:var(--muted);font-size:12px;word-break:break-all;flex:1;}
.pv-item .pv-msg{font-size:11.5px;font-weight:700;color:#FCA5A5;white-space:nowrap;}
.pv-item .pv-dup{font-size:11.5px;font-weight:700;color:#FBBF24;white-space:nowrap;}

/* ── Modal ── */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,0.62);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:400;padding:24px;}
.modal{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:26px;max-width:420px;width:100%;max-height:88vh;overflow-y:auto;}
.modal-title{font-family:'Gmarket Sans',sans-serif;font-size:19px;font-weight:700;color:var(--glow);margin-bottom:4px;}
.modal-sub{font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.7;}
.modal-fields{display:flex;flex-direction:column;gap:12px;margin-bottom:18px;}
.modal-fields .field{width:100%;}
.modal-fields .admin-input{width:100%;}
.modal-acts{display:flex;flex-direction:column;gap:9px;}
.m-btn{background:rgba(255,255,255,0.06);border:1px solid var(--border);color:var(--text);border-radius:11px;padding:12px 16px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all 0.2s;}
.m-btn:hover{border-color:var(--glow);background:rgba(56,189,248,0.1);}
.m-btn.danger{color:#FCA5A5;}
.m-btn.danger:hover{border-color:var(--red);background:rgba(239,68,68,0.1);}
.m-btn.close{color:var(--muted);}
.warn-box{background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.35);border-radius:11px;padding:12px 14px;font-size:12px;color:#FDE68A;line-height:1.7;margin-bottom:16px;}

/* ── Toast ── */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(16px);background:rgba(20,29,46,0.96);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1);color:var(--text);border-radius:14px;padding:12px 24px;font-size:14px;font-weight:700;z-index:500;opacity:0;transition:opacity 0.3s,transform 0.3s;max-width:88vw;text-align:center;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div id="app">
  <div class="loading-screen"><div class="spinner"></div><div style="font-size:14px">로딩 중...</div></div>
</div>
<div id="modalRoot"></div>
<div id="toast" class="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, getDocs, onSnapshot }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

// ── 설정 (다른 페이지와 동일한 Firebase 프로젝트) ──────────────
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBCZ8zOt6vy85QeuM2tmc1l0SbvLCgI4DI",
  authDomain: "project-7495985191493746478.firebaseapp.com",
  projectId: "project-7495985191493746478",
  storageBucket: "project-7495985191493746478.firebasestorage.app",
  messagingSenderId: "677977589186",
  appId: "1:677977589186:web:4e7eebc230be8dad2c825b"
};

// 교사 이메일 목록 (추가 가능)
const TEACHER_EMAILS = [
  'rapidwing@snu-g.ms.kr',
];

const MAX_NUMBER = 50;

// ── Firebase 초기화 ──────────────────────────────────────────
const fbApp = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);
const gProv = new GoogleAuthProvider();

const stuCol = collection(db, 'students');

let currentUser = null;
let students = [];
let unsubStudents = null;
let bulkRows = [];
let busy = false;

// ── 유틸 ─────────────────────────────────────────────────────
const isTeacher = u => u?.email && TEACHER_EMAILS.includes(u.email.toLowerCase());
const pad = n => String(n).padStart(2, '0');
const idOf = n => 'student_' + pad(n);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const validEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);

let toastT = null;
function showToast(msg, dur = 2600){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), dur);
}
function setApp(h){ document.getElementById('app').innerHTML = h; }
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }
function openModal(html){
  document.getElementById('modalRoot').innerHTML =
    `<div class="modal-back" id="mBack"><div class="modal">${html}</div></div>`;
  document.getElementById('mBack').addEventListener('click', e => { if(e.target.id === 'mBack') closeModal(); });
}
function saveErr(e){
  return /permission|insufficient/i.test(e.message)
    ? '권한이 없습니다 — Firestore 보안 규칙을 확인해주세요'
    : '실패: ' + e.message;
}

// ── 페이지 전환 버튼 (이 페이지는 교사 전용) ─────────────────
const NAV = [
  ['index.html','🏠 홈'], ['miracle6th.html','🌟 미라클 6월'],
  ['counseling.html','💬 상담'], ['seating.html','🪑 자리'], ['students.html','👥 명단'],
];
const navHtml = () => isTeacher(currentUser)
  ? `<div class="nav-links">${NAV.map(([h,t]) =>
      `<a class="${h === 'students.html' ? 'cur' : ''}" href="${h}">${t}</a>`).join('')}</div>`
  : '';

// ── 명단 실시간 감시 ─────────────────────────────────────────
function startWatch(){
  stopWatch();
  unsubStudents = onSnapshot(stuCol, snap => {
    students = snap.docs.map(d => ({ id:d.id, ...d.data() }))
                        .sort((a,b) => (a.number ?? 0) - (b.number ?? 0));
    paintStats(); paintTable();
  });
}
function stopWatch(){ if(unsubStudents){ unsubStudents(); unsubStudents = null; } }

// ── 다른 페이지의 기록까지 함께 옮기고 지우는 도우미 ──────────
// 학생 문서 id 는 출석번호에서 나오므로(student_07), 번호를 바꾸면
// 미라클 6월 기록·자리·상담 예약이 끊어진다. 그래서 같이 옮겨준다.
async function moveStudentRecords(oldId, newId, newData){
  // 미라클 6월 목표·코멘트
  const g = await getDoc(doc(db, 'goals', oldId));
  if(g.exists()){
    await setDoc(doc(db, 'goals', newId), g.data());
    await deleteDoc(doc(db, 'goals', oldId));
  }
  // 자리 선택
  const seats = await getDocs(collection(db, 'seating_seats'));
  for(const d of seats.docs){
    if(d.data().studentId === oldId)
      await setDoc(d.ref, { ...d.data(), studentId:newId, number:newData.number, name:newData.name });
  }
  const mine = await getDoc(doc(db, 'seating_mine', oldId));
  if(mine.exists()){
    await setDoc(doc(db, 'seating_mine', newId),
      { ...mine.data(), studentId:newId, number:newData.number, name:newData.name });
    await deleteDoc(doc(db, 'seating_mine', oldId));
  }
  // 상담 예약
  const resv = await getDocs(collection(db, 'counsel_resv'));
  for(const d of resv.docs){
    if(d.data().studentId === oldId)
      await setDoc(d.ref, { ...d.data(), studentId:newId, name:newData.name });
  }
}

// 학생이 잡아둔 자리·상담 예약을 풀어준다 (다른 학생이 쓸 수 있게)
async function releaseStudentSlots(sid){
  const seats = await getDocs(collection(db, 'seating_seats'));
  for(const d of seats.docs) if(d.data().studentId === sid) await deleteDoc(d.ref);
  await deleteDoc(doc(db, 'seating_mine', sid)).catch(() => {});

  const resv = await getDocs(collection(db, 'counsel_resv'));
  for(const d of resv.docs){
    if(d.data().studentId === sid){
      await setDoc(doc(db, 'counsel_slots', d.id), { taken:false }, { merge:true }).catch(() => {});
      await deleteDoc(d.ref);
    }
  }
}

// ── 추가 ─────────────────────────────────────────────────────
function checkNew(number, name, email, exceptId){
  if(!(number >= 1 && number <= MAX_NUMBER)) return `출석번호는 1~${MAX_NUMBER} 사이로 입력해주세요`;
  if(!name) return '이름을 입력해주세요';
  if(!validEmail(email)) return '이메일 형식을 확인해주세요';
  const dupEmail = students.find(s => (s.email || '').toLowerCase() === email && s.id !== exceptId);
  if(dupEmail) return `${dupEmail.number}번 ${dupEmail.name} 학생이 이미 쓰는 이메일입니다`;
  return null;
}

async function addOne(number, name, email){
  const err = checkNew(number, name, email);
  if(err){ showToast(err, 3200); return false; }
  const id = idOf(number);
  const exist = students.find(s => s.id === id);
  if(exist && !confirm(`${number}번은 이미 ${exist.name} 학생입니다.\n${name} 학생으로 덮어쓸까요?`)) return false;
  try{
    await setDoc(doc(stuCol, id), { number, name, email, uid: exist?.uid ?? null });
    showToast(`${number}번 ${name} 등록 완료 ✓`);
    return true;
  }catch(e){ showToast(saveErr(e), 3600); return false; }
}

// ── 여러 명 한 번에 (붙여넣기) ───────────────────────────────
// 한 줄에 한 명. 번호·이름·이메일 순서가 섞여 있어도 알아서 찾는다.
function parseBulk(text){
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);

  // 1차: 줄마다 번호·이름·이메일을 찾아낸다
  const rows = lines.map(line => {
    const parts = line.split(/[\t,;]+|\s+/).map(p => p.trim()).filter(Boolean);
    const email = (parts.find(p => p.includes('@')) || '').toLowerCase();
    const numTok = parts.find(p => /^\d{1,2}번?$/.test(p));
    const name = parts.filter(p => p !== email && p !== numTok && !p.includes('@')).join(' ');
    return { number: numTok ? parseInt(numTok) : null, name, email, raw: line };
  });

  // 2차: 번호가 안 적힌 줄에는 아직 아무도 안 쓰는 번호를 차례로 준다
  //      (기존 명단의 번호와 이번에 직접 적은 번호는 건너뛴다)
  const used = new Set([
    ...students.map(s => s.number),
    ...rows.filter(r => r.number !== null).map(r => r.number)
  ]);
  let next = 1;
  rows.forEach(r => {
    if(r.number !== null) return;
    while(next <= MAX_NUMBER && used.has(next)) next++;
    r.number = next; used.add(next); r.auto = true;
  });

  // 3차: 검사
  const seenEmail = new Set(), seenNum = new Set();
  return rows.map(row => {
    const { number, name, email } = row;
    if(!name) row.err = '이름을 못 찾았어요';
    else if(!validEmail(email)) row.err = '이메일을 못 찾았어요';
    else if(!(number >= 1 && number <= MAX_NUMBER)) row.err = `번호가 1~${MAX_NUMBER} 밖이에요`;
    else if(seenEmail.has(email)) row.err = '붙여넣은 목록 안에서 이메일이 겹쳐요';
    else if(seenNum.has(number)) row.err = '붙여넣은 목록 안에서 번호가 겹쳐요';
    else{
      seenEmail.add(email); seenNum.add(number);
      const dupE = students.find(s => (s.email || '').toLowerCase() === email);
      const dupN = students.find(s => s.number === number);
      if(dupE && dupE.number !== number) row.err = `${dupE.number}번 ${dupE.name} 학생의 이메일과 같아요`;
      else if(dupN) row.dup = `${dupN.number}번 ${dupN.name} → 덮어씀`;
    }
    return row;
  });
}

function paintBulkPreview(){
  const box = document.getElementById('bulkPv');
  const btn = document.getElementById('btnBulkSave');
  if(!box) return;
  const ok = bulkRows.filter(r => !r.err);
  if(!bulkRows.length){ box.innerHTML = ''; btn.disabled = true; btn.textContent = '목록 등록'; return; }
  box.innerHTML = `<div class="pv-list">${bulkRows.map(r => `
    <div class="pv-item${r.err ? ' bad' : ''}">
      <span class="pv-n">${r.err ? '—' : r.number + '번'}</span>
      <span class="pv-nm">${esc(r.name) || '<span style="color:#FCA5A5">?</span>'}</span>
      <span class="pv-em">${esc(r.email) || '<span style="opacity:0.55">이메일 없음</span>'}</span>
      ${r.err ? `<span class="pv-msg">⚠ ${r.err}</span>`
        : r.dup ? `<span class="pv-dup">↻ ${esc(r.dup)}</span>`
        : r.auto ? `<span class="pv-dup">번호 자동</span>` : ''}
    </div>`).join('')}</div>`;
  btn.disabled = !ok.length;
  btn.textContent = `${ok.length}명 등록하기`;
}

async function saveBulk(){
  const ok = bulkRows.filter(r => !r.err);
  if(!ok.length) return;
  const over = ok.filter(r => r.dup).length;
  if(!confirm(`${ok.length}명을 등록합니다.${over ? `\n그 중 ${over}명은 기존 학생을 덮어씁니다.` : ''}\n계속할까요?`)) return;
  busy = true;
  let done = 0;
  try{
    for(const r of ok){
      const exist = students.find(s => s.number === r.number);
      await setDoc(doc(stuCol, idOf(r.number)),
        { number:r.number, name:r.name, email:r.email, uid: exist?.uid ?? null });
      done++;
    }
    document.getElementById('bulkText').value = '';
    bulkRows = []; paintBulkPreview();
    showToast(`${done}명 등록 완료 ✓`, 3200);
  }catch(e){ showToast(`${done}명까지 등록됨 — ` + saveErr(e), 4200); }
  finally{ busy = false; }
}

// ── 수정 · 삭제 ──────────────────────────────────────────────
function openEdit(st){
  openModal(`
    <div class="modal-title">${esc(st.name)} 학생 정보 수정</div>
    <div class="modal-sub">현재 ${st.number}번 · ${st.uid ? '로그인 연결됨' : '아직 로그인한 적 없음'}</div>
    <div class="modal-fields">
      <div class="field"><label>출석번호</label>
        <input class="admin-input" id="eN" type="number" min="1" max="${MAX_NUMBER}" value="${st.number ?? ''}"></div>
      <div class="field"><label>이름</label>
        <input class="admin-input" id="eName" value="${esc(st.name)}"></div>
      <div class="field"><label>Google 이메일</label>
        <input class="admin-input" id="eEmail" type="email" value="${esc(st.email || '')}"></div>
    </div>
    <div class="modal-acts">
      <button class="m-btn" id="eSave" style="background:linear-gradient(135deg,var(--primary),#075985);border:none;color:#fff">💾 저장</button>
      ${st.uid ? `<button class="m-btn" id="eUnlink">🔗 로그인 연결 해제 (다른 계정으로 바꿀 때)</button>` : ''}
      <button class="m-btn danger" id="eDel">🗑 학생 삭제</button>
      <button class="m-btn close" id="eClose">닫기</button>
    </div>`);

  document.getElementById('eClose').addEventListener('click', closeModal);

  document.getElementById('eSave').addEventListener('click', async () => {
    const number = parseInt(document.getElementById('eN').value);
    const name = document.getElementById('eName').value.trim();
    const email = document.getElementById('eEmail').value.trim().toLowerCase();
    const err = checkNew(number, name, email, st.id);
    if(err){ showToast(err, 3200); return; }

    const newId = idOf(number);
    const data = { number, name, email, uid: st.uid ?? null };

    // 번호가 그대로면 단순 저장
    if(newId === st.id){
      try{
        await setDoc(doc(stuCol, st.id), data);
        closeModal(); showToast('수정 완료 ✓');
      }catch(e){ showToast(saveErr(e), 3600); }
      return;
    }
    // 번호가 바뀌면: 빈 번호인지 확인하고 기록까지 함께 옮긴다
    if(students.find(s => s.id === newId)){
      showToast(`${number}번은 이미 다른 학생이 쓰고 있어요`, 3200); return;
    }
    if(!confirm(`출석번호를 ${st.number}번 → ${number}번으로 바꿉니다.\n`
      + `미라클 6월 기록, 선택한 자리, 상담 예약도 함께 옮깁니다.\n계속할까요?`)) return;
    try{
      showToast('기록을 옮기는 중... ⏳', 8000);
      await setDoc(doc(stuCol, newId), data);
      await moveStudentRecords(st.id, newId, data);
      await deleteDoc(doc(stuCol, st.id));
      closeModal();
      showToast(`${st.number}번 → ${number}번으로 옮겼어요 ✓`, 3200);
    }catch(e){ showToast(saveErr(e), 4200); }
  });

  const bU = document.getElementById('eUnlink');
  if(bU) bU.addEventListener('click', async () => {
    if(!confirm(`${st.name} 학생의 로그인 연결을 해제할까요?\n다음에 로그인할 때 그 계정으로 다시 연결됩니다.`)) return;
    try{
      await setDoc(doc(stuCol, st.id), { number:st.number, name:st.name, email:st.email, uid:null });
      closeModal(); showToast('연결을 해제했어요 ✓');
    }catch(e){ showToast(saveErr(e), 3600); }
  });

  document.getElementById('eDel').addEventListener('click', () => { closeModal(); openDelete(st); });
}

function openDelete(st){
  openModal(`
    <div class="modal-title">${esc(st.name)} 학생 삭제</div>
    <div class="modal-sub">${st.number}번 · ${esc(st.email || '')}</div>
    <div class="warn-box">
      명단에서 지우고, 이 학생이 <b>선택한 자리</b>와 <b>상담 예약</b>을 풀어 다른 학생이 쓸 수 있게 합니다.<br>
      <b>미라클 6월 기록은 지우지 않고 남겨둡니다.</b> 같은 번호로 다시 등록하면 그대로 이어서 볼 수 있습니다.
    </div>
    <div class="modal-acts">
      <button class="m-btn danger" id="dOK">🗑 삭제합니다</button>
      <button class="m-btn close" id="dNo">취소</button>
    </div>`);
  document.getElementById('dNo').addEventListener('click', closeModal);
  document.getElementById('dOK').addEventListener('click', async () => {
    closeModal();
    try{
      showToast('정리하는 중... ⏳', 8000);
      await releaseStudentSlots(st.id);
      await deleteDoc(doc(stuCol, st.id));
      showToast(`${st.name} 학생을 삭제했어요 ✓`);
    }catch(e){ showToast(saveErr(e), 4200); }
  });
}

          <button class="mini" data-edit="${s.id}">✏️ 수정</button>
          <button class="mini danger" data-del="${s.id}">🗑</button>
        </div></td>
      </tr>`).join('')}
    </tbody></table></div>`;

  box.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click',

  box.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click',
    () => openDelete(students.find(s => s.id === b.dataset.del))));
}

async function copyRoster(){
  const txt = ['번호\t이름\t이메일',
    ...students.map(s => `${s.number}\t${s.name}\t${s.email || ''}`)].join('\n');
  try{ await navigator.clipboard.writeText(txt); showToast('명단을 복사했어요 ✓'); }
  catch{
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); showToast('명단을 복사했어요 ✓'); }
    catch{ showToast('복사 실패 — 직접 선택해 복사해주세요'); }
    ta.remove();
  }
}
