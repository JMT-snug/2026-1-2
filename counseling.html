<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1학년 2반 상담 신청 💬</title>
<link href="https://fonts.googleapis.com/css2?family=Gmarket+Sans:wght@300;500;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --primary:#0D9488; --glow:#2DD4BF; --accent:#F59E0B;
  --green:#10B981; --red:#EF4444;
  --bg:#0F1512; --surface:#16201C; --surface2:#1C2A25;
  --border:rgba(255,255,255,0.08);
  --text:#EEFFF9; --muted:#7FA096;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* ── Loading ── */
.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:20px;color:var(--muted);}
.spinner{width:48px;height:48px;border:3px solid rgba(45,212,191,0.2);border-top-color:var(--glow);border-radius:50%;animation:spin 0.9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── Login ── */
.login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:radial-gradient(ellipse at 30% 20%,rgba(45,212,191,0.12) 0%,transparent 60%),radial-gradient(ellipse at 70% 80%,rgba(245,158,11,0.08) 0%,transparent 60%),var(--bg);padding:24px;}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:28px;padding:56px 48px;text-align:center;max-width:400px;width:100%;position:relative;overflow:hidden;}
.login-card::before{content:'';position:absolute;top:-60px;left:50%;transform:translateX(-50%);width:200px;height:200px;background:radial-gradient(circle,rgba(45,212,191,0.22) 0%,transparent 70%);pointer-events:none;}
.login-icon{font-size:64px;margin-bottom:20px;}
.login-title{font-family:'Gmarket Sans',sans-serif;font-size:32px;font-weight:700;background:linear-gradient(135deg,#99F6E4,#2DD4BF,#F59E0B);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;}
.login-sub{font-size:14px;color:var(--muted);margin-bottom:40px;}
.btn-google{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:14px;color:var(--text);font-size:15px;font-weight:700;cursor:pointer;transition:all 0.25s;font-family:'Noto Sans KR',sans-serif;}
.btn-google:hover{background:rgba(45,212,191,0.12);border-color:rgba(45,212,191,0.4);transform:translateY(-2px);}
.btn-primary{background:linear-gradient(135deg,var(--primary),#0F766E);color:white;border:none;border-radius:12px;padding:14px 28px;font-size:15px;font-weight:700;cursor:pointer;width:100%;font-family:'Noto Sans KR',sans-serif;transition:all 0.2s;}

/* ── Header ── */
.header{background:rgba(22,32,28,0.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.header-left{display:flex;align-items:center;gap:14px;}
.header-title{font-family:'Gmarket Sans',sans-serif;font-size:18px;font-weight:700;}
.header-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.header-right{display:flex;align-items:center;gap:10px;}
.user-avatar{width:34px;height:34px;border-radius:50%;border:2px solid rgba(45,212,191,0.5);}
.user-name{font-size:13px;color:var(--muted);}
.badge-teacher{background:linear-gradient(135deg,#F59E0B,#EF4444);color:white;border-radius:8px;padding:3px 10px;font-size:11px;font-weight:900;letter-spacing:0.5px;}
.btn-signout{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:6px 14px;cursor:pointer;font-size:12px;transition:all 0.2s;font-family:'Noto Sans KR',sans-serif;}
.btn-signout:hover{border-color:var(--red);color:var(--red);}

/* ── Main ── */
.main-wrap{max-width:1000px;margin:0 auto;padding:32px 24px 80px;}
.section-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:16px;margin-top:36px;}

/* ── Admin panel ── */
.admin-panel{background:rgba(245,158,11,0.07);border:1px dashed rgba(245,158,11,0.4);border-radius:18px;padding:20px 22px;}
.admin-title{font-size:12px;font-weight:900;color:#FBBF24;margin-bottom:14px;letter-spacing:1px;text-transform:uppercase;}
.admin-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:11px;font-weight:700;color:var(--muted);}
.admin-input{background:rgba(255,255,255,0.06);border:1px solid rgba(245,158,11,0.3);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--text);font-family:'Noto Sans KR',sans-serif;transition:border-color 0.2s;color-scheme:dark;}
.admin-input:focus{outline:none;border-color:#FBBF24;}
.btn-admin{background:linear-gradient(135deg,#F59E0B,#D97706);color:white;border:none;border-radius:10px;padding:11px 20px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:'Noto Sans KR',sans-serif;}
.admin-hint{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.6;}

/* ── Copy bar ── */
.copy-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:rgba(45,212,191,0.08);border:1px solid rgba(45,212,191,0.35);border-radius:14px;padding:12px 16px;margin-top:14px;font-size:13px;font-weight:700;color:var(--glow);}
.copy-bar button{border:none;border-radius:9px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
.btn-repeat{background:rgba(45,212,191,0.2);color:var(--glow);}
.btn-copy-done{background:rgba(255,255,255,0.1);color:var(--text);}

/* ── Calendar ── */
.cal-scroll{overflow-x:auto;}
.cal{min-width:680px;background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;}
.cal-top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);}
.cal-month{font-family:'Gmarket Sans',sans-serif;font-size:16px;font-weight:700;color:var(--glow);}
.cal-nav{display:flex;gap:8px;}
.cal-nav button{background:rgba(255,255,255,0.06);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:6px 14px;font-size:13px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
.cal-nav button:hover{border-color:var(--glow);color:var(--glow);}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);background:rgba(255,255,255,0.03);border-bottom:1px solid var(--border);}
.cal-hcell{text-align:center;font-size:11px;font-weight:900;color:var(--muted);padding:8px 4px;letter-spacing:1px;}
.cal-hcell.sun{color:rgba(239,68,68,0.8);}
.cal-hcell.sat{color:#5EEAD4;}
.cal-row{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--border);}
.cal-row:first-of-type{border-top:none;}
.cal-cell{border-right:1px solid var(--border);min-height:92px;padding:6px;position:relative;}
.cal-cell:last-child{border-right:none;}
.cal-cell.empty{background:rgba(0,0,0,0.15);}
.cal-cell.today{box-shadow:inset 0 0 0 2px rgba(45,212,191,0.4);}
.cal-date{font-size:12px;font-weight:900;color:var(--muted);margin-bottom:5px;font-family:'Gmarket Sans',sans-serif;display:flex;justify-content:space-between;align-items:center;}
.cal-cell.sun-col .cal-date{color:rgba(239,68,68,0.7);}
.cal-cell.sat-col .cal-date{color:#5EEAD4;}
.btn-copy{background:transparent;border:none;font-size:12px;cursor:pointer;opacity:0.55;padding:0 2px;}
.btn-copy:hover{opacity:1;}
.cal-cell.pastable{cursor:copy;}
.cal-cell.pastable:hover{background:rgba(45,212,191,0.08);}
.cal-cell.t-clickable{cursor:pointer;}
.cal-cell.t-clickable:hover{background:rgba(255,255,255,0.03);}

/* 교사용 칩 */
.tchip{display:flex;align-items:center;justify-content:space-between;gap:4px;background:rgba(45,212,191,0.09);border:1px solid rgba(45,212,191,0.28);border-radius:8px;padding:3px 6px;font-size:11px;font-weight:700;margin-bottom:4px;}
.tchip.taken{background:rgba(245,158,11,0.1);border-color:rgba(245,158,11,0.4);}
.tchip .nm{color:#FBBF24;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:64px;}
.slot-del{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:12px;padding:0 1px;line-height:1;}
.slot-del:hover{color:var(--red);}

/* 학생용 시간 버튼 */
.sbtn{display:block;width:100%;margin-bottom:4px;border-radius:8px;padding:5px 6px;font-size:12px;font-weight:700;border:1px solid;font-family:'Noto Sans KR',sans-serif;text-align:center;}
.sbtn.free{background:rgba(45,212,191,0.1);border-color:rgba(45,212,191,0.4);color:var(--glow);cursor:pointer;transition:all 0.15s;}
.sbtn.free:hover{background:rgba(45,212,191,0.25);transform:translateY(-1px);}
.sbtn.mine{background:rgba(16,185,129,0.16);border-color:rgba(16,185,129,0.55);color:#6EE7B7;cursor:pointer;}
.sbtn.mine:hover{border-color:var(--red);color:#FCA5A5;}
.sbtn.other{background:rgba(255,255,255,0.03);border-color:var(--border);color:var(--muted);cursor:default;}
.sbtn.past{opacity:0.3;cursor:default;}

/* 내 신청 목록 */
.my-list{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 20px;}
.my-item{display:flex;align-items:center;justify-content:space-between;padding:10px 4px;border-bottom:1px solid var(--border);font-size:14px;font-weight:700;}
.my-item:last-child{border-bottom:none;}
.btn-cancel{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:5px 12px;font-size:12px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
.btn-cancel:hover{border-color:var(--red);color:var(--red);}
.my-empty{font-size:13px;color:var(--muted);padding:8px 0;}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:12px 2px 20px;}
.legend span{display:flex;align-items:center;gap:6px;}
.dot{width:12px;height:12px;border-radius:4px;display:inline-block;}
.dot.free{background:rgba(45,212,191,0.35);}
.dot.mine{background:rgba(16,185,129,0.6);}
.dot.other{background:rgba(255,255,255,0.12);}
.empty-state{text-align:center;padding:50px 20px;color:var(--muted);}
.empty-state .em{font-size:44px;margin-bottom:12px;}

/* ── Toast ── */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(16px);background:rgba(22,36,31,0.95);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1);color:var(--text);border-radius:14px;padding:12px 24px;font-size:14px;font-weight:700;z-index:300;opacity:0;transition:opacity 0.3s,transform 0.3s;white-space:nowrap;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div id="app">
  <div class="loading-screen"><div class="spinner"></div><div style="font-size:14px">로딩 중...</div></div>
</div>
<div id="toast" class="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, doc, setDoc, deleteDoc, collection, getDocs, query, where,
         onSnapshot, runTransaction }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

// ── 설정 (미라클 6월과 동일한 Firebase 프로젝트) ──────────────
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBCZ8zOt6vy85QeuM2tmc1l0SbvLCgI4DI",
  authDomain: "project-7495985191493746478.firebaseapp.com",
  projectId: "project-7495985191493746478",
  storageBucket: "project-7495985191493746478.firebasestorage.app",
  messagingSenderId: "677977589186",
  appId: "1:677977589186:web:4e7eebc230be8dad2c825b"
};

// 교사 이메일 목록 (추가 가능)
const TEACHER_EMAILS = [
  'rapidwing@snu-g.ms.kr',
];

// ── Firebase 초기화 ──────────────────────────────────────────
const fbApp = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);
const gProv = new GoogleAuthProvider();

let currentUser = null, userProfile = null;
let slotList = [];          // 모든 상담 시간
let resvMap = {};           // (교사용) slotId → 예약자 정보
let myResvIds = new Set();  // (학생용) 내가 신청한 slotId
let unsubSlots = null;      // 실시간 감시 해제용
let viewY = 0, viewM = 0;   // 달력에서 보고 있는 연/월
let copySrc = null;         // 복사 모드의 원본 날짜

// ── 유틸 ─────────────────────────────────────────────────────
const isTeacher = u => u?.email && TEACHER_EMAILS.includes(u.email.toLowerCase());
let toastT = null;
function showToast(msg, dur = 2600){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), dur);
}
function setApp(h){ document.getElementById('app').innerHTML = h; }
const pad = n => String(n).padStart(2,'0');
const dstr = (y,m,d) => `${y}-${pad(m)}-${pad(d)}`;
function todayStr(){ const t = new Date(); return dstr(t.getFullYear(), t.getMonth()+1, t.getDate()); }
function fmtDate(d){
  const [y,m,dd] = d.split('-').map(Number);
  const day = ['일','월','화','수','목','금','토'][new Date(y, m-1, dd).getDay()];
  return `${m}월 ${dd}일 (${day})`;
}
function addDays(d, n){
  const [y,m,dd] = d.split('-').map(Number);
  const t = new Date(y, m-1, dd + n);
  return dstr(t.getFullYear(), t.getMonth()+1, t.getDate());
}
const toMin = t => { const [h,m] = t.split(':').map(Number); return h*60 + m; };
const toTime = m => pad(Math.floor(m/60)) + ':' + pad(m%60);

// 미라클 6월에서 쓰는 students 명단을 그대로 재사용
async function findByEmail(email){
  try{
    const s = await getDocs(query(collection(db,'students'), where('email','==',email.toLowerCase())));
    if(s.empty) return null;
    const d = s.docs[0]; return { id:d.id, ...d.data() };
  }catch{ return null; }
}

// ── 데이터 ───────────────────────────────────────────────────
function groupByDate(){
  const g = {};
  slotList.forEach(s => { (g[s.date] = g[s.date] || []).push(s); });
  return g;
}
async function loadResvAll(){ // 교사: 예약자 명단
  try{
    const s = await getDocs(collection(db,'counsel_resv'));
    resvMap = {};
    s.docs.forEach(d => resvMap[d.id] = d.data());
  }catch{ resvMap = {}; }
}
async function loadMyResv(){ // 학생: 내 예약
  try{
    const s = await getDocs(query(collection(db,'counsel_resv'), where('uid','==',currentUser.uid)));
    myResvIds = new Set(s.docs.map(d => d.id));
  }catch{ myResvIds = new Set(); }
}

// 실시간 감시: 시간표가 바뀌면 달력을 자동으로 다시 그림
function startWatch(){
  if(unsubSlots) unsubSlots();
  unsubSlots = onSnapshot(collection(db,'counsel_slots'), async snap => {
    slotList = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    slotList.sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));
    if(!userProfile) return;
    if(userProfile.role === 'teacher'){ await loadResvAll(); paintCalendar(); }
    else { paintCalendar(); paintMyList(); }
  });
}

// ── 달력 그리기 ──────────────────────────────────────────────
function monthWeeks(y, m){
  const startDow = new Date(y, m-1, 1).getDay();
  const daysIn = new Date(y, m, 0).getDate();
  const weeks = []; let week = new Array(startDow).fill(null);
  for(let d = 1; d <= daysIn; d++){
    week.push(d);
    if(week.length === 7){ weeks.push(week); week = []; }
  }
  if(week.length){ while(week.length < 7) week.push(null); weeks.push(week); }
  return weeks;
}

function calendarHtml(){
  const teacher = userProfile.role === 'teacher';
  const groups = groupByDate();
  const today = todayStr();
  const headers = ['일','월','화','수','목','금','토'].map((h,i) =>
    `<div class="cal-hcell ${i===0?'sun':i===6?'sat':''}">${h}</div>`).join('');

  const rows = monthWeeks(viewY, viewM).map(week => {
    const cells = week.map((day, ci) => {
      if(day === null) return `<div class="cal-cell empty"></div>`;
      const date = dstr(viewY, viewM, day);
      const slots = groups[date] || [];
      const isPast = date < today;

      let chips = '';
      if(teacher){
        chips = slots.map(s => `
          <div class="tchip${s.taken?' taken':''}">
            <span>${s.time}</span>
            ${s.taken ? `<span class="nm">${(resvMap[s.id]?.name)||'?'}</span>` : ''}
            <button class="slot-del" data-id="${s.id}" data-taken="${s.taken?1:0}" title="삭제">✕</button>
          </div>`).join('');
      }else{
        chips = slots.map(s => {
          const mine = myResvIds.has(s.id);
          if(mine)
            return `<button class="sbtn mine" data-id="${s.id}" data-act="cancel" title="누르면 취소">${s.time} ✓</button>`;
          if(s.taken)
            return `<button class="sbtn other" disabled>${s.time} 예약됨</button>`;
          if(isPast)
            return `<button class="sbtn free past" disabled>${s.time}</button>`;
          return `<button class="sbtn free" data-id="${s.id}" data-act="reserve">${s.time}</button>`;
        }).join('');
      }

      const cls = ['cal-cell',
        ci===0?'sun-col':ci===6?'sat-col':'',
        date===today?'today':'',
        teacher ? (copySrc && copySrc!==date ? 'pastable' : 't-clickable') : ''
      ].filter(Boolean).join(' ');

      const copyBtn = (teacher && slots.length && !copySrc)
        ? `<button class="btn-copy" data-copy="${date}" title="이 날짜의 시간 복사">📋</button>` : '';

      return `<div class="${cls}" data-date="${date}">
        <div class="cal-date"><span>${day}</span>${copyBtn}</div>
        ${chips}
      </div>`;
    }).join('');
    return `<div class="cal-row">${cells}</div>`;
  }).join('');

  return `
  <div class="cal-scroll"><div class="cal">
    <div class="cal-top">
      <span class="cal-month">${viewY}년 ${viewM}월</span>
      <div class="cal-nav">
        <button id="calPrev">◀ 이전 달</button>
        <button id="calToday">오늘</button>
        <button id="calNext">다음 달 ▶</button>
      </div>
    </div>
    <div class="cal-head">${headers}</div>
    ${rows}
  </div></div>`;
}

function paintCalendar(){
  const area = document.getElementById('calArea');
  if(!area) return;
  area.innerHTML = calendarHtml();

  // 달 이동
  document.getElementById('calPrev').addEventListener('click', () => {
    viewM--; if(viewM < 1){ viewM = 12; viewY--; } paintCalendar();
  });
  document.getElementById('calNext').addEventListener('click', () => {
    viewM++; if(viewM > 12){ viewM = 1; viewY++; } paintCalendar();
  });
  document.getElementById('calToday').addEventListener('click', () => {
    const t = new Date(); viewY = t.getFullYear(); viewM = t.getMonth()+1; paintCalendar();
  });

  if(userProfile.role === 'teacher') attachTeacherCal();
  else attachStudentCal();
}

// ── 교사: 달력 동작 (셀 클릭·복사·삭제) ──────────────────────
function updateCopyBar(){
  const bar = document.getElementById('copyBar');
  if(!bar) return;
  if(!copySrc){ bar.style.display = 'none'; bar.innerHTML = ''; return; }
  const cnt = (groupByDate()[copySrc] || []).length;
  bar.style.display = 'flex';
  bar.innerHTML = `
    📋 <b>${fmtDate(copySrc)}</b>의 시간 ${cnt}칸 복사 중 — 달력에서 붙여넣을 날짜를 클릭하세요
    <button class="btn-repeat" id="btnRepeat">🔁 매주 반복</button>
    <button class="btn-copy-done" id="btnCopyDone">완료</button>`;
  document.getElementById('btnCopyDone').addEventListener('click', () => {
    copySrc = null; updateCopyBar(); paintCalendar();
  });
  document.getElementById('btnRepeat').addEventListener('click', async () => {
    const n = parseInt(prompt('몇 주 동안 같은 요일에 반복할까요? (예: 4)', '4'));
    if(!n || n < 1 || n > 12){ showToast('1~12 사이 숫자를 입력해주세요'); return; }
    let total = 0;
    for(let k = 1; k <= n; k++) total += await pasteTo(addDays(copySrc, 7*k), true);
    showToast(`${n}주 반복 완료 — ${total}칸 만들었어요 ✓`);
    copySrc = null; updateCopyBar();
  });
}

async function pasteTo(targetDate, silent){
  const times = (groupByDate()[copySrc] || []).map(s => s.time);
  const exist = new Set(slotList.map(s => s.id));
  let made = 0;
  try{
    for(const t of times){
      const id = `${targetDate}_${t}`;
      if(exist.has(id)) continue;
      await setDoc(doc(db,'counsel_slots',id), {
        date: targetDate, time: t, taken: false, createdAt: new Date().toISOString()
      });
      made++;
    }
    if(!silent) showToast(made ? `${fmtDate(targetDate)}에 ${made}칸 붙여넣기 ✓` : '모두 이미 있는 시간이에요');
  }catch(e){ showToast('복사 실패: ' + e.message); }
  return made;
}

function attachTeacherCal(){
  // 복사 시작 버튼
  document.querySelectorAll('.btn-copy').forEach(b => {
    b.addEventListener('click', e => {
      e.stopPropagation();
      copySrc = b.dataset.copy;
      updateCopyBar(); paintCalendar();
    });
  });
  // 셀 클릭: 복사 모드면 붙여넣기, 아니면 생성 패널에 날짜 채우기
  document.querySelectorAll('.cal-cell[data-date]').forEach(cell => {
    cell.addEventListener('click', async e => {
      if(e.target.closest('.slot-del') || e.target.closest('.btn-copy')) return;
      const date = cell.dataset.date;
      if(copySrc){
        if(date !== copySrc) await pasteTo(date, false);
      }else{
        const inp = document.getElementById('inDate');
        if(inp){ inp.value = date; showToast(`${fmtDate(date)} 선택됨 — 위에서 시간을 만들어보세요`); }
      }
    });
  });
  // 삭제
  document.querySelectorAll('.slot-del').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      const id = btn.dataset.id;
      if(btn.dataset.taken === '1' && !confirm('이미 학생이 신청한 시간입니다. 정말 삭제할까요?')) return;
      try{
        await deleteDoc(doc(db,'counsel_resv',id)).catch(()=>{});
        await deleteDoc(doc(db,'counsel_slots',id));
        showToast('삭제했어요 ✓');
      }catch(err){ showToast('삭제 실패: ' + err.message); }
    });
  });
}

// ── 학생: 신청 / 취소 (선착순 안전장치) ───────────────────────
async function reserveSlot(s){
  await runTransaction(db, async tx => {
    const ref = doc(db,'counsel_slots',s.id);
    const snap = await tx.get(ref);
    if(!snap.exists()) throw new Error('선생님이 삭제한 시간이에요');
    if(snap.data().taken) throw new Error('앗, 방금 다른 친구가 먼저 신청했어요 😅');
    tx.update(ref, { taken: true });
    tx.set(doc(db,'counsel_resv',s.id), {
      date: s.date, time: s.time,
      uid: currentUser.uid, studentId: userProfile.studentId,
      name: userProfile.name, createdAt: new Date().toISOString()
    });
  });
}
async function cancelSlot(s){
  await runTransaction(db, async tx => {
    const ref = doc(db,'counsel_slots',s.id);
    const snap = await tx.get(ref);
    if(snap.exists()) tx.update(ref, { taken: false });
    tx.delete(doc(db,'counsel_resv',s.id));
  });
}

function attachStudentCal(){
  document.querySelectorAll('.sbtn[data-id]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const s = slotList.find(x => x.id === btn.dataset.id);
      if(!s) return;
      if(btn.dataset.act === 'reserve'){
        if(!confirm(`${fmtDate(s.date)} ${s.time}에 상담을 신청할까요?`)) return;
        try{
          await reserveSlot(s);
          myResvIds.add(s.id);
          showToast(`${fmtDate(s.date)} ${s.time} 신청 완료 ✓`);
        }catch(e){ showToast(e.message.includes('먼저')||e.message.includes('삭제') ? e.message : '신청 실패: ' + e.message, 3200); }
      }else{
        if(!confirm(`${fmtDate(s.date)} ${s.time} 신청을 취소할까요?`)) return;
        try{
          await cancelSlot(s);
          myResvIds.delete(s.id);
          showToast('취소했어요');
        }catch(e){ showToast('취소 실패: ' + e.message); }
      }
    });
  });
}

function paintMyList(){
  const box = document.getElementById('myList');
  if(!box) return;
  const mine = slotList.filter(s => myResvIds.has(s.id));
  if(!mine.length){ box.innerHTML = `<div class="my-empty">아직 신청한 상담이 없어요. 달력에서 초록빛 시간을 눌러 신청해 보세요!</div>`; return; }
  box.innerHTML = mine.map(s => `
    <div class="my-item">
      <span>💬 ${fmtDate(s.date)} · ${s.time}</span>
      <button class="btn-cancel" data-id="${s.id}">취소</button>
    </div>`).join('');
  box.querySelectorAll('.btn-cancel').forEach(btn => {
    btn.addEventListener('click', async () => {
      const s = slotList.find(x => x.id === btn.dataset.id);
      if(!s || !confirm(`${fmtDate(s.date)} ${s.time} 신청을 취소할까요?`)) return;
      try{ await cancelSlot(s); myResvIds.delete(s.id); showToast('취소했어요'); }
      catch(e){ showToast('취소 실패: ' + e.message); }
    });
  });
}

// ── 교사 메인 ────────────────────────────────────────────────
function renderTeacherMain(){
  const t = new Date(); viewY = t.getFullYear(); viewM = t.getMonth()+1;
  setApp(`
    ${headerHtml()}
    <div class="main-wrap">
      <div class="section-title" style="margin-top:0">🔧 상담 시간 만들기</div>
      <div class="admin-panel">
        <div class="admin-title">날짜와 시간을 정하면 시간 칸을 자동으로 만듭니다</div>
        <div class="admin-row">
          <div class="field"><label>날짜 (달력 클릭으로도 선택)</label>
            <input class="admin-input" id="inDate" type="date"></div>
          <div class="field"><label>시작</label>
            <input class="admin-input" id="inStart" type="time" value="15:00"></div>
          <div class="field"><label>종료</label>
            <input class="admin-input" id="inEnd" type="time" value="17:00"></div>
          <div class="field"><label>간격(분)</label>
            <input class="admin-input" id="inGap" type="number" value="20" min="5" max="120" style="width:80px"></div>
          <button class="btn-admin" id="btnGen">+ 시간 만들기</button>
        </div>
        <div class="admin-hint">
          한 칸만 추가하려면 종료를 비워두세요. 이미 있는 시간은 건너뜁니다.
          날짜의 📋를 누르면 그 날의 시간을 다른 날짜로 복사하거나 매주 반복할 수 있어요.
        </div>
        <div class="copy-bar" id="copyBar" style="display:none"></div>
      </div>

      <div class="section-title">📅 상담 시간표 <span style="font-weight:400;text-transform:none;letter-spacing:0">— 예약되면 학생 이름이 표시됩니다 (실시간)</span></div>
      <div id="calArea"></div>
    </div>
  `);
  document.getElementById('btnSO').addEventListener('click', () => signOut(auth));

  document.getElementById('btnGen').addEventListener('click', async () => {
    const date = document.getElementById('inDate').value;
    const start = document.getElementById('inStart').value;
    const end = document.getElementById('inEnd').value;
    const gap = parseInt(document.getElementById('inGap').value);
    if(!date){ showToast('날짜를 선택해주세요'); return; }
    if(!start){ showToast('시작 시각을 입력해주세요'); return; }
    if(!gap || gap < 5){ showToast('간격은 5분 이상으로 해주세요'); return; }

    let times = [];
    if(!end){ times = [start]; }
    else{
      if(toMin(end) <= toMin(start)){ showToast('종료 시각이 시작보다 늦어야 합니다'); return; }
      for(let m = toMin(start); m + gap <= toMin(end); m += gap) times.push(toTime(m));
      if(!times.length) times = [start];
    }
    if(times.length > 40){ showToast('한 번에 40칸까지만 만들 수 있어요'); return; }

    const exist = new Set(slotList.map(s => s.id));
    let made = 0;
    try{
      for(const tm of times){
        const id = `${date}_${tm}`;
        if(exist.has(id)) continue;
        await setDoc(doc(db,'counsel_slots',id), {
          date, time: tm, taken: false, createdAt: new Date().toISOString()
        });
        made++;
      }
      showToast(made ? `${fmtDate(date)}에 ${made}칸 만들었어요 ✓` : '모두 이미 있는 시간이에요');
      const [y,m] = date.split('-').map(Number); viewY = y; viewM = m;
    }catch(e){ showToast('저장 실패: ' + e.message); }
  });

  startWatch(); // 실시간 감시 시작 → 달력이 자동으로 그려짐
}

// ── 로그인 상태 감시 ──────────────────────────────────────────
onAuthStateChanged(auth, async user => {
  if(unsubSlots){ unsubSlots(); unsubSlots = null; }
  if(!user){ currentUser = null; userProfile = null; copySrc = null; renderLogin(); return; }
  currentUser = user;

  if(isTeacher(user)){
    userProfile = { role:'teacher' };
    renderTeacherMain(); return;
  }

  const student = await findByEmail(user.email);
  if(!student){ renderUnregistered(user.email); return; }

  userProfile = { studentId: student.id, name: student.name, role: 'student' };
  renderStudentMain();
});
