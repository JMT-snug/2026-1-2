<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1학년 2반 🏠</title>
<link href="https://fonts.googleapis.com/css2?family=Gmarket+Sans:wght@300;500;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --primary:#4F46E5; --glow:#818CF8; --accent:#F59E0B;
  --bg:#0C0F16; --surface:#161B26; --surface2:#1E2534;
  --border:rgba(255,255,255,0.08);
  --text:#EDF1F7; --muted:#8592A6;
  --c-miracle:#6366F1; --c-counsel:#2DD4BF; --c-seat:#FB923C; --c-roster:#38BDF8;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* ── Loading ── */
.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:20px;color:var(--muted);}
.spinner{width:48px;height:48px;border:3px solid rgba(129,140,248,0.2);border-top-color:var(--glow);border-radius:50%;animation:spin 0.9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── Login ── */
.login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:radial-gradient(ellipse at 25% 15%,rgba(99,102,241,0.16) 0%,transparent 58%),radial-gradient(ellipse at 75% 85%,rgba(45,212,191,0.10) 0%,transparent 58%),var(--bg);padding:24px;}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:28px;padding:54px 46px;text-align:center;max-width:410px;width:100%;position:relative;overflow:hidden;}
.login-card::before{content:'';position:absolute;top:-60px;left:50%;transform:translateX(-50%);width:220px;height:220px;background:radial-gradient(circle,rgba(129,140,248,0.24) 0%,transparent 70%);pointer-events:none;}
.login-icon{font-size:60px;margin-bottom:18px;}
.login-title{font-family:'Gmarket Sans',sans-serif;font-size:34px;font-weight:700;background:linear-gradient(135deg,#A5B4FC,#5EEAD4,#FDBA74);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;}
.login-sub{font-size:14px;color:var(--muted);margin-bottom:38px;line-height:1.8;}
.btn-google{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:14px;color:var(--text);font-size:15px;font-weight:700;cursor:pointer;transition:all 0.25s;font-family:'Noto Sans KR',sans-serif;}
.btn-google:hover{background:rgba(129,140,248,0.12);border-color:rgba(129,140,248,0.45);transform:translateY(-2px);}
.btn-primary{background:linear-gradient(135deg,var(--primary),#4338CA);color:white;border:none;border-radius:12px;padding:14px 28px;font-size:15px;font-weight:700;cursor:pointer;width:100%;font-family:'Noto Sans KR',sans-serif;}

/* ── Header ── */
.header{background:rgba(22,27,38,0.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;gap:12px;flex-wrap:wrap;}
.header-left{display:flex;align-items:center;gap:14px;}
.header-title{font-family:'Gmarket Sans',sans-serif;font-size:18px;font-weight:700;}
.header-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.user-avatar{width:34px;height:34px;border-radius:50%;border:2px solid rgba(129,140,248,0.5);}
.user-name{font-size:13px;color:var(--muted);}
.badge-teacher{background:linear-gradient(135deg,#F59E0B,#EF4444);color:white;border-radius:8px;padding:3px 10px;font-size:11px;font-weight:900;letter-spacing:0.5px;}
.btn-signout{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:6px 14px;cursor:pointer;font-size:12px;transition:all 0.2s;font-family:'Noto Sans KR',sans-serif;}
.btn-signout:hover{border-color:#EF4444;color:#FCA5A5;}

/* ── Main ── */
.main-wrap{max-width:900px;margin:0 auto;padding:44px 24px 80px;}
.hello{font-family:'Gmarket Sans',sans-serif;font-size:27px;font-weight:700;margin-bottom:6px;}
.hello em{font-style:normal;color:var(--glow);}
.hello-sub{font-size:14px;color:var(--muted);margin-bottom:34px;line-height:1.7;}
.section-title{font-size:12px;font-weight:900;color:var(--muted);letter-spacing:2px;margin:34px 0 14px;}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;}
.card{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:26px 24px;position:relative;overflow:hidden;transition:transform 0.2s,border-color 0.2s,background 0.2s;}
.card::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 12% 0%,var(--tone,transparent) 0%,transparent 62%);opacity:0.16;pointer-events:none;transition:opacity 0.2s;}
.card:hover{transform:translateY(-4px);border-color:var(--tone);background:var(--surface2);}
.card:hover::before{opacity:0.3;}
.card-em{font-size:38px;margin-bottom:14px;display:block;}
.card-title{font-family:'Gmarket Sans',sans-serif;font-size:19px;font-weight:700;margin-bottom:6px;color:var(--tone);}
.card-desc{font-size:13px;color:var(--muted);line-height:1.7;}
.card-tag{display:inline-block;margin-top:14px;font-size:11px;font-weight:900;letter-spacing:1px;color:var(--tone);opacity:0.8;}

.foot-note{margin-top:40px;padding-top:20px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);line-height:1.9;}
</style>
</head>
<body>
<div id="app">
  <div class="loading-screen"><div class="spinner"></div><div style="font-size:14px">로딩 중...</div></div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, collection, getDocs, query, where }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

// ── 설정 (다른 페이지와 동일한 Firebase 프로젝트) ──────────────
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBCZ8zOt6vy85QeuM2tmc1l0SbvLCgI4DI",
  authDomain: "project-7495985191493746478.firebaseapp.com",
  projectId: "project-7495985191493746478",
  storageBucket: "project-7495985191493746478.firebasestorage.app",
  messagingSenderId: "677977589186",
  appId: "1:677977589186:web:4e7eebc230be8dad2c825b"
};

// 교사 이메일 목록 (추가 가능)
const TEACHER_EMAILS = [
  'rapidwing@snu-g.ms.kr',
];

// 페이지 목록. teacherOnly 가 true 면 교사에게만 보입니다.
const PAGES = [
  { href:'miracle6th.html', em:'🌟', tone:'var(--c-miracle)', title:'미라클 6월',
    desc:'6월 일정표와 월간·주간·하루 목표를 적고, 사진과 선생님 코멘트를 남겨요.',
    tag:'목표 관리', teacherOnly:false },
  { href:'counseling.html', em:'💬', tone:'var(--c-counsel)', title:'상담 신청',
    desc:'선생님과 이야기 나눌 시간을 달력에서 골라 신청해요.',
    tag:'선착순 예약', teacherOnly:false },
  { href:'seating.html', em:'🪑', tone:'var(--c-seat)', title:'자리 선택',
    desc:'앉고 싶은 자리를 먼저 누른 사람이 가져가요. 한 번 고르면 바꿀 수 없어요.',
    tag:'선착순', teacherOnly:false },
  { href:'students.html', em:'👥', tone:'var(--c-roster)', title:'학생 명단 관리',
    desc:'학생 추가·수정·삭제, 명단 붙여넣기, 로그인 연결 확인.',
    tag:'교사 전용', teacherOnly:true },
];

// ── Firebase 초기화 ──────────────────────────────────────────
const fbApp = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);
const gProv = new GoogleAuthProvider();

const isTeacher = u => u?.email && TEACHER_EMAILS.includes(u.email.toLowerCase());
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function setApp(h){ document.getElementById('app').innerHTML = h; }

async function findByEmail(email){
  try{
    const s = await getDocs(query(collection(db,'students'), where('email','==',email.toLowerCase())));
    if(s.empty) return null;
    const d = s.docs[0]; return { id:d.id, ...d.data() };
  }catch{ return null; }
}

function cardHtml(p){
  return `<a class="card" href="${p.href}" style="--tone:${p.tone}">
    <span class="card-em">${p.em}</span>
    <div class="card-title">${p.title}</div>
    <div class="card-desc">${p.desc}</div>
    <div class="card-tag">${p.tag}</div>
  </a>`;
}

// ── 메인 ─────────────────────────────────────────────────────
function renderHome(user, profile){
  const teacher = profile.role === 'teacher';
  const list = PAGES.filter(p => teacher || !p.teacherOnly);

  setApp(`
    <div class="header">
      <div class="header-left">
        <div>
          <div class="header-title">🏠 1학년 2반</div>
          <div class="header-sub">2026학년도</div>
        </div>
        ${teacher ? '<span class="badge-teacher">교사</span>' : ''}
      </div>
      <div class="header-right">
        ${user.photoURL ? `<img class="user-avatar" src="${user.photoURL}" referrerpolicy="no-referrer">` : ''}
        <span class="user-name">${esc(teacher ? (user.displayName || '') : profile.name)}</span>
        <button class="btn-signout" id="btnSO">로그아웃</button>
      </div>
    </div>

    <div class="main-wrap">
      <div class="hello">${teacher ? '안녕하세요, ' : ''}<em>${esc(teacher ? (user.displayName || '선생님') : profile.name)}</em>${teacher ? '님' : '아, 안녕!'}</div>
      <div class="hello-sub">${teacher
        ? '아래에서 관리할 페이지를 고르세요. 각 페이지 위쪽에서도 서로 바로 오갈 수 있습니다.'
        : '하고 싶은 활동을 골라보세요.'}</div>

      <div class="section-title">${teacher ? '페이지' : '우리 반 활동'}</div>
      <div class="cards">${list.map(cardHtml).join('')}</div>

      ${teacher ? `<div class="foot-note">
        <b>알아두기</b><br>
        · 페이지 사이 이동 버튼은 교사 계정에만 보입니다. 학생에게는 나타나지 않습니다.<br>
        · 학생은 이 첫 화면에서 학생 명단 관리를 볼 수 없습니다.<br>
        · 등록되지 않은 이메일로 로그인한 학생은 어느 페이지에서도 안내 화면만 보게 됩니다.
      </div>` : ''}
    </div>
  `);
  document.getElementById('btnSO').addEventListener('click', () => signOut(auth));
}

// ── 로그인 화면 ───────────────────────────────────────────────
function renderLogin(){
  setApp(`
    <div class="login-screen"><div class="login-card">
      <div class="login-icon">🏠</div>
      <div class="login-title">1학년 2반</div>
      <div class="login-sub">우리 반 홈페이지<br>학교 Google 계정으로 로그인하세요</div>
      <button class="btn-google" id="bL">
        <svg width="20" height="20" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Google 계정으로 로그인
      </button>
    </div></div>
  `);
  document.getElementById('bL').addEventListener('click', async () => {
    try{ await signInWithPopup(auth, gProv); }
    catch(e){ alert('로그인 실패: ' + e.message); }
  });
}

// ── 미등록 계정 안내 ──────────────────────────────────────────
function renderUnregistered(email){
  setApp(`
    <div class="login-screen"><div class="login-card">
      <div style="font-size:52px;margin-bottom:16px">⛔</div>
      <div class="login-title" style="font-size:22px">등록되지 않은 계정</div>
      <div class="login-sub" style="margin-bottom:28px">
        <strong>${esc(email)}</strong><br>은 등록된 학생 이메일이 아닙니다.<br><br>
        선생님께 이메일 등록을 요청하세요.
      </div>
      <button class="btn-primary" id="bLO">로그아웃</button>
    </div></div>
  `);
  document.getElementById('bLO').addEventListener('click', () => signOut(auth));
}

// ── 로그인 상태 감시 ──────────────────────────────────────────
onAuthStateChanged(auth, async user => {
  if(!user){ renderLogin(); return; }
  if(isTeacher(user)){ renderHome(user, { role:'teacher' }); return; }
  const student = await findByEmail(user.email);
  if(!student){ renderUnregistered(user.email); return; }
  renderHome(user, { role:'student', name:student.name, studentId:student.id });
});
</script>
</body>
</html>
